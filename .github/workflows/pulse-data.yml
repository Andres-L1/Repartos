name: Actualizar datos de Pulse
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pulse-data.yml'
      - 'scripts/collect-analytics.mjs'
      - 'pulse/analytics.mjs'
      - 'pulse/performance-world.mjs'
      - 'scripts/collect-full-performance.mjs'
      - 'pulse/analytics-catalog.json'
permissions:
  contents: write
concurrency:
  group: pulse-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - name: Recopilar listas mensuales y visitas diarias
        run: node scripts/collect-analytics.mjs
      - name: Calcular progresiones mundiales
        run: node scripts/collect-full-performance.mjs
      - name: Comprobar los datos antes de publicarlos
        run: npm test
      - name: Publicar instantánea validada
        run: |
          git config user.name 'chedex-pulse[bot]'
          git config user.email 'chedex-pulse[bot]@users.noreply.github.com'
          git add pulse/public/snapshots/latest.json pulse/public/snapshots/performance
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Actualizar datos FIDE y Wikimedia [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
